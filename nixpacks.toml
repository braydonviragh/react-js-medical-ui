# Nixpacks configuration for frontend-only deployment (using localStorage)
# This builds the React app and serves it statically

[phases.setup]
nixPkgs = ["nodejs_18"]

[phases.install]
cmds = [
  "cd medical-frontend && npm install"
]

[phases.build]
cmds = [
  "cd medical-frontend && npm run build"
]

[start]
cmd = "cd medical-frontend && npx serve -s build -p $PORT"
