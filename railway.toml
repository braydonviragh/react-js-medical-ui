# Railway Configuration for Medical UI (Frontend Only with localStorage)

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "cd medical-frontend && npx serve -s build -p $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
NODE_ENV = "production"
PUBLIC_URL = "https://$RAILWAY_PUBLIC_DOMAIN"
